version: v0.4
project:
  name: Mader's clique-minor density bounds and Hadwiger for t ≤ 4
  description: A Lean 4 / Mathlib formalization of Mader's theorem (a nonempty finite graph of average
    degree at least 2^(r−2) has a K_r minor), of Dirac's lemma (a graph without a K4 minor has a vertex
    of degree at most two, hence at most 2n − 3 edges for n ≥ 2), and of Hadwiger's conjecture for t
    ≤ 4 (graphs without a K3 minor are 2-colourable, graphs without a K4 minor are 3-colourable). Minors
    are branch-set models. The extension proves that n ≥ 3 and e ≥ 3n − 5 force a K5 minor, the contrapositive
    e ≤ 3n − 6 for K5-minor-free graphs, and that finite minors have no more vertices than their host.
  authors:
  - Juan Pablo Traverso Gianini
  license: Apache-2.0
  responsible_maintainers:
  - Juan Pablo Traverso Gianini
classification:
  arxiv:
  - math.CO
  msc2020:
  - 05C83
  - 05C15
  - 05C35
