status:
  scope: 'Proved for finite simple graphs (any universe): Mader''s theorem for every r, Dirac''s degree
    lemma and the 2n − 3 edge bound for K4-minor-free graphs, and Hadwiger''s conjecture for t = 3 and
    t = 4. Also proved: the K5 density threshold for n ≥ 3, its 3n − 6 contrapositive bound, and finite
    minor cardinality monotonicity. All eight selected results are proved. Challenge contains eight
    intentional statement placeholders; Solution and library modules contain none.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
